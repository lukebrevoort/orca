name: Orca
options:
  bundleIdPrefix: com.orca
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
targets:
  Orca:
    type: application
    platform: iOS
    sources: [Orca]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orca.mail
        INFOPLIST_FILE: Orca/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Orca/Resources/Orca.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Orca/Resources/OrcaRelease.entitlements
    scheme:
      testTargets: [OrcaTests, OrcaUITests]
  OrcaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [OrcaTests]
    dependencies:
      - target: Orca
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orca.mail.tests
        GENERATE_INFOPLIST_FILE: YES
  OrcaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [OrcaUITests]
    dependencies:
      - target: Orca
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orca.mail.uitests
        GENERATE_INFOPLIST_FILE: YES
