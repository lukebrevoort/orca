name: PR217 mobile-web screenshots
on:
  pull_request:
    branches: [mobile-web-native-inspired-inbox]
    paths:
      - .github/workflows/mobile-web-217-screenshots.yml
      - apps/api/scripts/mobile-web-217-fixture.ts
      - apps/web/scripts/mobile-web-217-screenshots.mjs
permissions:
  contents: read
concurrency:
  group: mobile-web-217-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  screenshots:
    name: Synthetic mobile-web screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PR217_PRODUCT_SHA: f681315db7a6a5aef473d12ea5929ef34f162d7c
      PR217_BASELINE_SHA: 24c0de70a9371191485210f7acd4ce8bc7ab54d8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify integrated PR217 product source
        run: |
          [[ "$PR217_PRODUCT_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$PR217_BASELINE_SHA" "$PR217_PRODUCT_SHA"
          git diff --exit-code "$PR217_PRODUCT_SHA" HEAD -- . ":(exclude).github/workflows/mobile-web-217-screenshots.yml" ":(exclude)apps/api/scripts/mobile-web-217-fixture.ts" ":(exclude)apps/web/scripts/mobile-web-217-screenshots.mjs"
          test -z "$(find . -name node_modules -prune -o -name '.env*' ! -name '.env.example' -type f -print)"
      - run: bun install --frozen-lockfile
      - name: Build candidate production web
        run: bun run --cwd apps/web build
      - name: Build pinned main production web baseline
        run: |
          baseline="$RUNNER_TEMP/mobile217-baseline-source"
          test ! -e "$baseline"
          git worktree add --detach "$baseline" "$PR217_BASELINE_SHA"
          test "$(git -C "$baseline" rev-parse HEAD)" = "$PR217_BASELINE_SHA"
          test -z "$(find "$baseline" -name node_modules -prune -o -name '.env*' ! -name '.env.example' -type f -print)"
          (cd "$baseline" && bun install --frozen-lockfile && bun run --cwd apps/web build)
      - run: bunx --no-install playwright install --with-deps chromium
      - name: Capture mobile gates and compare desktop baseline
        run: node apps/web/scripts/mobile-web-217-screenshots.mjs "${{ runner.temp }}/mobile-web-217-evidence"
      - name: Upload synthetic screenshots only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-web-217-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mobile-web-217-evidence/
          retention-days: 7
          if-no-files-found: ignore
