name: PR217 mobile-web screenshots
on:
  pull_request:
    branches: [mobile-web-native-inspired-inbox]
    paths:
      - .github/workflows/mobile-web-217-screenshots.yml
      - apps/api/scripts/mobile-web-217-fixture.ts
      - apps/web/scripts/mobile-web-217-screenshots.mjs
permissions:
  contents: read
concurrency:
  group: mobile-web-217-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  screenshots:
    name: Synthetic mobile-web screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify original PR217 product source
        run: |
          git diff --exit-code d6e63ffcebd66a6ddec4e705a701d62ab71217c1 HEAD -- apps/web/src apps/web/public apps/web/index.html apps/web/vite.config.ts apps/web/package.json apps/api/src apps/api/drizzle packages bun.lock package.json
          test -z "$(find . -name node_modules -prune -o -name '.env*' ! -name '.env.example' -type f -print)"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx --no-install playwright install --with-deps chromium
      - name: Capture exact-head synthetic app
        run: node apps/web/scripts/mobile-web-217-screenshots.mjs "${{ runner.temp }}/mobile-web-217-evidence"
      - name: Upload synthetic screenshots only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mobile-web-217-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mobile-web-217-evidence/
          retention-days: 7
          if-no-files-found: ignore
