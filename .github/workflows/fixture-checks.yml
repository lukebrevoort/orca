name: Fixture Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fixtures-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-api:
    name: Production build and browser/API
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:smoke
      - run: bunx --no-install playwright install --with-deps chromium
      - name: Exercise production browser against isolated API/SQLite
        run: bash scripts/ci/fixture-check.sh browser
      - name: Upload sanitized synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-api-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/orca-ci-evidence/
          if-no-files-found: ignore
          retention-days: 7

  ios-simulator:
    name: Unsigned iOS unit and compose UI
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # Installed on the standard macos-26 arm64 image; fail rather than silently drift.
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Test on a fresh CI-owned simulator
        run: bash scripts/ci/fixture-check.sh ios
      - name: Upload sanitized synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-simulator-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/orca-ci-evidence/
          if-no-files-found: ignore
          retention-days: 7
