name: Native Reader Checks

on:
  pull_request:
    paths:
      - 'apps/ios/**'
      - 'scripts/ci/**'
      - '.github/workflows/native-reader.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-reader-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reader:
    name: Native reader unit and light/dark UI
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      ORCA_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ORCA_CI_UI_TEST_SCOPE: reading
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Test exact source on a fresh CI-owned simulator
        run: bash scripts/ci/fixture-check.sh ios
      - name: Upload sanitized synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-reader-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/orca-ci-evidence/
          if-no-files-found: ignore
          retention-days: 7
